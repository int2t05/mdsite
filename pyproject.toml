[project]
name = "mdsite"
version = "0.1.3"
description = "Preview and build websites directly from Markdown directories"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["zensical==0.1.2"]
keywords = ["markdown", "documentation", "zensical", "static-site-generator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
]

[project.urls]
Homepage = "https://github.com/int2t05/mdsite"
Issues = "https://github.com/int2t05/mdsite/issues"
Source = "https://github.com/int2t05/mdsite"

[project.scripts]
mdsite = "mdsite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdsite"]

[tool.hatch.build.targets.sdist]
include = ["src/**", "tests/**", "pyproject.toml", "README.md", "LICENSE", "uv.lock"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]
